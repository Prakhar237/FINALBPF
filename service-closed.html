<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Closed</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f0f0f;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #e0e0e0;
        }

        .container {
            text-align: center;
            padding: 3rem 2rem;
            max-width: 560px;
        }

        .icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            opacity: 0.7;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }

        p {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #888;
        }

        .divider {
            width: 60px;
            height: 2px;
            background: #333;
            margin: 1.5rem auto;
        }

        .notice {
            font-size: 0.85rem;
            color: #555;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🚫</div>
        <h1>Service Closed</h1>
        <div class="divider"></div>
        <p>This service has been permanently closed due to project abandonment and breach of agreement by the client.</p>
        <p class="notice">No further access is available.</p>
    </div>
</body>
</html>
